services:
  backend:
    build:
      context: ./backend
    environment:
      ACOUSTICSPACE_MODEL_PATH: /app/models/wav2vec2_asvspoof_domain_v2/best
      ACOUSTICSPACE_INFERENCE_BATCH_SIZE: "2"
    volumes:
      - ./backend/models:/app/models:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped